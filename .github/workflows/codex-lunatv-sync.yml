name: Codex LunaTV Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-lunatv-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Prepare LunaTV sync')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync LunaTV release and preserve private assets
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_REPO="https://github.com/MoonTechLab/LunaTV.git"
          UPSTREAM_REF="v100.1.3"
          EXPECTED_COMMIT="388089d2a1799c2b2ef7c17357dc7c5b19d8f26f"
          UPSTREAM_DIR="$RUNNER_TEMP/LunaTV"
          SAVE_DIR="$RUNNER_TEMP/moontv-protected"

          protected_files=(
            "config.json"
            "public/logo.png"
            "public/favicon.ico"
            "public/icons/icon-192x192.png"
            "public/icons/icon-256x256.png"
            "public/icons/icon-384x384.png"
            "public/icons/icon-512x512.png"
          )

          mkdir -p "$SAVE_DIR"
          for path in "${protected_files[@]}"; do
            if [ -f "$path" ]; then
              mkdir -p "$SAVE_DIR/$(dirname "$path")"
              cp "$path" "$SAVE_DIR/$path"
            fi
          done

          git clone --branch "$UPSTREAM_REF" --depth 1 "$UPSTREAM_REPO" "$UPSTREAM_DIR"
          actual_commit="$(git -C "$UPSTREAM_DIR" rev-parse HEAD)"
          if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
            echo "Unexpected upstream commit: $actual_commit"
            exit 1
          fi

          rsync -a --delete --exclude='.git' "$UPSTREAM_DIR"/ ./

          for path in "${protected_files[@]}"; do
            if [ -f "$SAVE_DIR/$path" ]; then
              mkdir -p "$(dirname "$path")"
              cp "$SAVE_DIR/$path" "$path"
            fi
          done

          rm -f .github/workflows/codex-lunatv-sync.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "Update to LunaTV 100.1.3"
          git push origin HEAD:main
